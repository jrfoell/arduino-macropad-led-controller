# sketch.yaml
# Arduino CLI "Sketch Project File" — pins the board core and libraries this
# sketch depends on, so `arduino-cli compile --profile macropad` (or an IDE
# that reads sketch.yaml) resolves the same environment every time.
#
# NOT YET VERIFIED end-to-end (see CLAUDE.md — nothing in this repo has been
# compiled against real board/library packages yet):
#   - `fqbn` below is arduino-pico's presumed id for "Adafruit MacroPad
#     RP2040" (Tools > Board > Raspberry Pi RP2040 Boards > "Adafruit
#     MacroPad RP2040"), following that core's `rp2040:rp2040:<board_id>`
#     pattern — but the exact `<board_id>` wasn't confirmed against a live
#     boards.txt. Run `arduino-cli board listall | grep -i macropad` once
#     the core is installed and fix this line if it differs.
#   - Library names are the Library Manager listing names described in
#     CLAUDE.md's "Expected libraries" section — double check with
#     `arduino-cli lib search <name>` if `lib install` can't find one.
#   - Versions are intentionally omitted (the sketch.yaml schema allows
#     this — omitted versions just use whatever's installed system-wide)
#     rather than guessed. Pin exact versions here once you've installed
#     everything and confirmed what you're actually running, via
#     `arduino-cli lib list` / `arduino-cli core list`, for a fully
#     reproducible build.

profiles:
  macropad:
    fqbn: rp2040:rp2040:adafruit_macropad
    platforms:
      - platform: rp2040:rp2040
        platform_index_url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
    libraries:
      # Onboard MacroPad NeoPixels + (possibly) outdoor LEDs — keypad_leds.h, led_presets.h
      - Adafruit NeoPixel
      # 128x64 SH1106G OLED — oled_display.h
      - Adafruit SH110X
      # Adafruit SH110X's own dependencies. Listed explicitly: unlike a plain
      # `arduino-cli lib install`, a sketch.yaml profile does not appear to
      # auto-resolve a library's transitive Library Manager dependencies.
      - Adafruit GFX Library
      - Adafruit BusIO
      # Rotary encoder decoding (LatchMode::FOUR3) — rotary_input.h
      - RotaryEncoder
      # MCP23017 I2C GPIO expander — gpio_expander.h. Only actually used
      # when HARDWARE_GPIO_EXPANDER is defined in the .ino, but listed
      # unconditionally since sketch.yaml has no concept of the sketch's
      # compile-time feature flags.
      - Adafruit MCP23017 Arduino Library

default_profile: macropad
